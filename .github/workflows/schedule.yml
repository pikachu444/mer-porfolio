name: 메르AI 포트폴리오 분석

concurrency:
  # A live portfolio state must never be updated by two runs at once.
  group: mer-ai-portfolio-${{ github.ref }}
  cancel-in-progress: false

on:
  # 00:17 KST (15:17 UTC) primary. Avoid the top of the hour, where GitHub
  # can delay or drop scheduled jobs under load.
  schedule:
    - cron: "17 15 * * *"
    # 09:17 KST (00:17 UTC) recovery. It is safe because a KST-day delivery
    # receipt below makes scheduled reports at-most-once, even if GitHub
    # delivers the primary very late.
    - cron: "17 0 * * *"

  workflow_dispatch:
    inputs:
      run_mode:
        description: "verify=output, full_verify=live flow, rebalance=live portfolio, test=mock only"
        required: true
        default: "verify"
        type: choice
        options:
          - verify
          - full_verify
          - rebalance
          - test
      fetch_days:
        description: "Optional RSS collection window in days"
        required: false
        default: ""
        type: string
      gemini_summary_model:
        description: "Optional post-summary model; default is gemini-3.1-flash-lite"
        required: false
        default: ""
        type: string
      gemini_decision_model:
        description: "Optional investment-decision model; default is gemini-3.5-flash"
        required: false
        default: ""
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Prevent a stuck external call from blocking a later scheduled portfolio run.
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required for a safe rebase when a human push overlaps a report push.
          fetch-depth: 0

      - name: Guard scheduled report delivery
        id: schedule_guard
        if: ${{ github.event_name == 'schedule' }}
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          # A queued schedule event can still checkout an older SHA. Always
          # inspect the latest remote receipt after acquiring workflow
          # concurrency, rather than trusting the working tree.
          set -euo pipefail
          git fetch origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          branch = os.environ["TARGET_BRANCH"]
          today = datetime.now(ZoneInfo("Asia/Seoul")).date().isoformat()

          def remote_json(path: str):
              result = subprocess.run(
                  ["git", "show", f"origin/{branch}:{path}"],
                  check=False,
                  capture_output=True,
                  text=True,
                  encoding="utf-8",
              )
              if result.returncode:
                  return None, False
              try:
                  return json.loads(result.stdout), True
              except (TypeError, json.JSONDecodeError):
                  return None, True

          def kst_date(value: object) -> str | None:
              if not isinstance(value, str) or not value:
                  return None
              try:
                  parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  return None
              if parsed.tzinfo is None:
                  parsed = parsed.replace(tzinfo=ZoneInfo("Asia/Seoul"))
              return parsed.astimezone(ZoneInfo("Asia/Seoul")).date().isoformat()

          decision = "run"
          reason = "no_delivery_receipt_for_kst_day"
          receipt, receipt_exists = remote_json("output/scheduled_delivery_receipt.json")
          if receipt_exists:
              if not isinstance(receipt, dict):
                  decision = "block"
                  reason = "invalid_scheduled_delivery_receipt"
              elif receipt.get("kst_date") == today:
                  status = receipt.get("delivery_status")
                  if status == "delivered":
                      decision = "skip"
                      reason = "scheduled_report_already_delivered"
                  else:
                      # A prepared receipt means either delivery failed, or
                      # Telegram accepted it before its final receipt push.
                      # Resending would risk a duplicate report.
                      decision = "block"
                      reason = "scheduled_delivery_status_unconfirmed"

          # Compatibility guard for a primary run queued on the pre-receipt
          # workflow revision. A same-day scheduled receipt without a marker
          # is not evidence that a manual rebalance ran, so only this mode
          # blocks recovery delivery.
          if decision == "run":
              run_status, status_exists = remote_json("output/run_status.json")
              if status_exists:
                  if not isinstance(run_status, dict):
                      decision = "block"
                      reason = "invalid_run_status_for_delivery_guard"
                  else:
                      mode = run_status.get("mode")
                      completed_date = kst_date(run_status.get("completed_at"))
                      valid_modes = {"scheduled", "rebalance", "verify", "full_verify", "test"}
                      if mode not in valid_modes or completed_date is None:
                          decision = "block"
                          reason = "invalid_run_status_for_delivery_guard"
                      elif mode == "scheduled" and completed_date == today:
                          decision = "block"
                          reason = "legacy_scheduled_delivery_status_unknown"

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"decision={decision}\n")
              handle.write(f"reason={reason}\n")
          level = "notice" if decision in {"run", "skip"} else "warning"
          print(f"::{level}::Scheduled delivery guard: {decision} ({reason})")
          PY

      - name: Stop unknown scheduled delivery from being resent
        if: ${{ github.event_name == 'schedule' && steps.schedule_guard.outputs.decision == 'block' }}
        run: |
          echo "::error::A same-day scheduled report may already have been delivered; automatic resend is intentionally blocked."
          exit 1

      - name: Guard live branch
        if: ${{ (github.event_name == 'schedule' || github.event.inputs.run_mode == 'rebalance') && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Live scheduled/rebalance runs are allowed only on main."
          exit 1

      - name: Set up Python
        if: ${{ github.event_name != 'schedule' || steps.schedule_guard.outputs.decision == 'run' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Korean fonts
        if: ${{ github.event_name != 'schedule' || steps.schedule_guard.outputs.decision == 'run' }}
        run: sudo apt-get install -y -q fonts-nanum && fc-cache -fv

      - name: Install dependencies
        if: ${{ github.event_name != 'schedule' || steps.schedule_guard.outputs.decision == 'run' }}
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Run automated tests
        if: ${{ github.event_name != 'schedule' || steps.schedule_guard.outputs.decision == 'run' }}
        run: python -m unittest discover -s tests -v

      - name: Run portfolio analysis
        id: analyze
        if: ${{ (github.event_name == 'schedule' && steps.schedule_guard.outputs.decision == 'run') || (github.event_name != 'schedule' && github.event.inputs.run_mode != 'test') }}
        # Live Telegram delivery is deferred until after the report/state commit.
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://pikachu444.github.io/mer-portfolio/output/dashboard.html
          OUTPUT_DIR: output
          RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || github.event.inputs.run_mode || 'verify' }}
          FETCH_DAYS: ${{ github.event.inputs.fetch_days || '' }}
          GEMINI_SUMMARY_MODEL: ${{ github.event.inputs.gemini_summary_model || 'gemini-3.1-flash-lite' }}
          GEMINI_DECISION_MODEL: ${{ github.event.inputs.gemini_decision_model || 'gemini-3.5-flash' }}
          # User-facing action policy: compare approved target vs actual weight.
          REBALANCE_BAND_PCT: '0.50'
          MINIMUM_TRADE_WEIGHT_PCT: '0.50'
          MINIMUM_TRADE_AMOUNT: '0.50'
          ALLOW_FRACTIONAL_SHARES: 'true'
          MARKET_OPEN_CHECK: 'false'
          STALE_PRICE_THRESHOLD_DAYS: '3'
          ENABLE_POST_SUMMARIES: ${{ (github.event_name == 'schedule' || github.event.inputs.run_mode == 'rebalance' || github.event.inputs.run_mode == 'full_verify') && 'true' || 'false' }}
          # Live reports are delivered only after their state/report commit succeeds.
          DEFER_TELEGRAM_DELIVERY_TO_WORKFLOW: ${{ (github.event_name == 'schedule' || github.event.inputs.run_mode == 'rebalance') && 'true' || 'false' }}
        run: python main.py

      - name: Validate safe live output
        id: live_output
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.run_mode == 'rebalance') && (github.event_name != 'schedule' || steps.schedule_guard.outputs.decision == 'run') }}
        env:
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'rebalance' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output_file = Path(os.environ["GITHUB_OUTPUT"])

          def emit(safe: bool, reason: str) -> None:
              with output_file.open("a", encoding="utf-8") as handle:
                  handle.write(f"safe_operating_output={'true' if safe else 'false'}\n")
                  handle.write(f"validation_reason={reason}\n")
              level = "notice" if safe else "warning"
              print(f"::{level}::Live output receipt: {reason}")

          receipt_path = Path("output/run_status.json")
          try:
              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
              output_root = Path("output").resolve()
              report_name = receipt.get("report_path")
              if receipt.get("schema_version") != 1:
                  raise ValueError("unsupported_schema")
              if receipt.get("github_run_id") != os.environ["EXPECTED_RUN_ID"]:
                  raise ValueError("wrong_run_id")
              if receipt.get("mode") != os.environ["EXPECTED_MODE"]:
                  raise ValueError("wrong_mode")
              if receipt.get("mode") not in {"scheduled", "rebalance"}:
                  raise ValueError("not_live_mode")
              if receipt.get("state_bundle_committed") is not True:
                  raise ValueError("bundle_not_committed")
              if receipt.get("telegram_delivery_deferred") is not True:
                  raise ValueError("delivery_not_deferred")
              if not isinstance(report_name, str) or not report_name:
                  raise ValueError("missing_report_path")
              report_path = (output_root / report_name).resolve()
              if report_path.parent != output_root or not report_path.is_file():
                  raise ValueError("report_not_under_output")
          except (OSError, ValueError, TypeError, json.JSONDecodeError) as error:
              emit(False, str(error).replace(" ", "_")[:120])
          else:
              emit(True, "validated")
          PY

      - name: Upload verify artifact
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'verify' }}
        uses: actions/upload-artifact@v4
        with:
          name: mer-ai-verify-${{ github.run_id }}
          path: output/verify
          if-no-files-found: warn
          retention-days: 14

      - name: Upload full verification artifact
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'full_verify' }}
        uses: actions/upload-artifact@v4
        with:
          name: mer-ai-full-verify-${{ github.run_id }}
          path: output/full_verify
          if-no-files-found: warn
          retention-days: 14

      - name: Mark scheduled report delivery as prepared
        id: scheduled_delivery_prepare
        if: ${{ always() && github.event_name == 'schedule' && steps.live_output.outputs.safe_operating_output == 'true' }}
        env:
          EXPECTED_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          output_root = Path("output")
          run_status_path = output_root / "run_status.json"
          try:
              run_status = json.loads(run_status_path.read_text(encoding="utf-8"))
              if run_status.get("github_run_id") != os.environ["EXPECTED_RUN_ID"]:
                  raise ValueError("wrong_run_id")
              if run_status.get("mode") != "scheduled":
                  raise ValueError("wrong_mode")
              report_path = run_status.get("report_path")
              if not isinstance(report_path, str) or not report_path:
                  raise ValueError("missing_report_path")
          except (OSError, ValueError, TypeError, json.JSONDecodeError) as error:
              print(f"::error::Cannot create scheduled delivery receipt: {type(error).__name__}")
              raise SystemExit(1)

          now = datetime.now(ZoneInfo("Asia/Seoul"))
          receipt = {
              "schema_version": 1,
              "kst_date": now.date().isoformat(),
              "report_path": report_path,
              "prepared_at": now.isoformat(),
              "prepared_by_run_id": os.environ["EXPECTED_RUN_ID"],
              "delivery_status": "prepared",
              "delivered_at": None,
              "delivered_by_run_id": None,
          }
          receipt_path = output_root / "scheduled_delivery_receipt.json"
          temporary = receipt_path.with_suffix(".json.tmp")
          temporary.write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          temporary.replace(receipt_path)
          print(f"Scheduled delivery receipt prepared for {receipt['kst_date']}")
          PY

      - name: Commit and push live report
        id: persist
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.run_mode == 'rebalance') && steps.live_output.outputs.safe_operating_output == 'true' && (github.event_name != 'schedule' || steps.scheduled_delivery_prepare.outcome == 'success') }}
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "Update MerAI report"
          # Do not overwrite an overlapping human push; replay the report commit instead.
          git fetch origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Deliver persisted Telegram report
        id: telegram_delivery
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.run_mode == 'rebalance') && steps.live_output.outputs.safe_operating_output == 'true' && steps.persist.outcome == 'success' }}
        # Keep collecting diagnostic artifacts, then make a rejected delivery red
        # in the explicit final gate below.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://pikachu444.github.io/mer-portfolio/output/dashboard.html
          OUTPUT_DIR: output
          RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'rebalance' }}
          REBALANCE_BAND_PCT: '0.50'
          MINIMUM_TRADE_WEIGHT_PCT: '0.50'
          MINIMUM_TRADE_AMOUNT: '0.50'
          ALLOW_FRACTIONAL_SHARES: 'true'
          MARKET_OPEN_CHECK: 'false'
          STALE_PRICE_THRESHOLD_DAYS: '3'
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime
          from pathlib import Path

          from telegram_notify import send_photo, send_structured_summary

          output_root = Path(os.environ["OUTPUT_DIR"]).resolve()

          def output_file(name: object, label: str) -> Path:
              if not isinstance(name, str) or not name:
                  raise ValueError(f"missing_{label}")
              path = (output_root / name).resolve()
              if path.parent != output_root or not path.is_file():
                  raise ValueError(f"invalid_{label}")
              return path

          try:
              receipt = json.loads(output_file("run_status.json", "receipt").read_text(encoding="utf-8"))
              if receipt.get("telegram_delivery_deferred") is not True:
                  raise ValueError("delivery_not_deferred")
              chart_path = output_file(receipt.get("chart_path"), "chart_path")
              state = json.loads(output_file("portfolio_state.json", "state").read_text(encoding="utf-8"))
              performance = json.loads(
                  output_file("performance_cache.json", "performance_cache").read_text(encoding="utf-8")
              )
              if not isinstance(state, dict) or not isinstance(performance, dict):
                  raise ValueError("invalid_delivery_payload")
              completed_at = str(receipt.get("completed_at") or "")
              try:
                  today_label = datetime.fromisoformat(completed_at.replace("Z", "+00:00")).strftime(
                      "%Y-%m-%d"
                  )
              except ValueError:
                  today_label = completed_at[:10] or "today"
              run_label = str(receipt.get("run_label") or receipt.get("mode") or os.environ["RUN_MODE"])
              no_changes = receipt.get("no_changes") is True
              status_note = str(receipt.get("status_note") or "")
          except (OSError, ValueError, TypeError, json.JSONDecodeError) as error:
              print(f"::error::Persisted Telegram delivery inputs invalid: {type(error).__name__}")
              sys.exit(1)

          photo_ok = send_photo(str(chart_path), f"MerAI model portfolio | {today_label}")
          summary_ok = send_structured_summary(
              state,
              today_label,
              performance,
              no_changes=no_changes,
              status_note=status_note,
              include_dashboard_link=True,
              run_label=run_label,
          )
          if not (photo_ok and summary_ok):
              missing = []
              if not photo_ok:
                  missing.append("chart")
              if not summary_ok:
                  missing.append("structured_summary")
              print("::error::Persisted Telegram report delivery incomplete: " + ",".join(missing))
              sys.exit(1)
          print("Persisted Telegram report delivery accepted.")
          PY

      - name: Record scheduled Telegram delivery
        id: scheduled_delivery_receipt
        if: ${{ always() && github.event_name == 'schedule' && steps.live_output.outputs.safe_operating_output == 'true' && steps.persist.outcome == 'success' && steps.telegram_delivery.outcome == 'success' }}
        # A post-send push can fail after Telegram accepted the report. Keep
        # the earlier prepared receipt in that case so a recovery run alerts
        # rather than risking a duplicate message.
        continue-on-error: true
        env:
          EXPECTED_RUN_ID: ${{ github.run_id }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          receipt_path = Path("output/scheduled_delivery_receipt.json")
          try:
              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
              today = datetime.now(ZoneInfo("Asia/Seoul")).date().isoformat()
              if receipt.get("schema_version") != 1:
                  raise ValueError("unsupported_schema")
              if receipt.get("kst_date") != today:
                  raise ValueError("wrong_kst_date")
              if receipt.get("prepared_by_run_id") != os.environ["EXPECTED_RUN_ID"]:
                  raise ValueError("wrong_run_id")
              if receipt.get("delivery_status") != "prepared":
                  raise ValueError("unexpected_delivery_status")
          except (OSError, ValueError, TypeError, json.JSONDecodeError) as error:
              print(f"::error::Cannot record scheduled Telegram delivery: {type(error).__name__}")
              raise SystemExit(1)

          now = datetime.now(ZoneInfo("Asia/Seoul"))
          receipt["delivery_status"] = "delivered"
          receipt["delivered_at"] = now.isoformat()
          receipt["delivered_by_run_id"] = os.environ["EXPECTED_RUN_ID"]
          temporary = receipt_path.with_suffix(".json.tmp")
          temporary.write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          temporary.replace(receipt_path)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/scheduled_delivery_receipt.json
          if git diff --cached --quiet; then
            echo "::error::Scheduled delivery receipt did not change after accepted delivery."
            exit 1
          fi
          git commit -m "Record scheduled Telegram delivery"
          git fetch origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Upload live run snapshot
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.run_mode == 'rebalance') && steps.live_output.outputs.safe_operating_output == 'true' && steps.persist.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mer-ai-operating-${{ github.run_id }}
          path: |
            output/portfolio_state.json
            output/decision_latest.json
            output/model_portfolio_ledger.json
            output/performance_cache.json
            output/posts_db.json
            output/dashboard.html
            output/chart_latest.png
            output/run_status.json
            output/scheduled_delivery_receipt.json
            output/report_*.md
          if-no-files-found: warn
          retention-days: 14

      - name: Upload live failure diagnostics
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.run_mode == 'rebalance') && (github.event_name != 'schedule' || steps.schedule_guard.outputs.decision == 'run') && (steps.analyze.outcome == 'failure' || steps.live_output.outputs.safe_operating_output != 'true' || steps.scheduled_delivery_prepare.outcome == 'failure' || steps.persist.outcome == 'failure' || steps.telegram_delivery.outcome == 'failure' || steps.scheduled_delivery_receipt.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mer-ai-live-failure-${{ github.run_id }}
          path: |
            output/run_status.json
            output/portfolio_state.json
            output/decision_latest.json
            output/model_portfolio_ledger.json
            output/performance_cache.json
            output/posts_db.json
            output/dashboard.html
            output/chart_latest.png
            output/report_*.md
            output/scheduled_delivery_receipt.json
            output/error_*.log
          if-no-files-found: warn
          retention-days: 21

      - name: Enforce validated live output
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.run_mode == 'rebalance') && (github.event_name != 'schedule' || steps.schedule_guard.outputs.decision == 'run') && steps.live_output.outputs.safe_operating_output != 'true' }}
        run: |
          echo "::error::No validated deferred-delivery receipt was produced; report/state were not persisted or delivered."
          exit 1

      - name: Enforce live report persistence
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.run_mode == 'rebalance') && steps.live_output.outputs.safe_operating_output == 'true' && steps.persist.outcome != 'success' }}
        run: |
          echo "::error::Validated report/state could not be committed and pushed; Telegram delivery was intentionally skipped."
          exit 1

      - name: Enforce persisted Telegram delivery
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.run_mode == 'rebalance') && steps.live_output.outputs.safe_operating_output == 'true' && steps.persist.outcome == 'success' && steps.telegram_delivery.outcome != 'success' }}
        run: |
          echo "::error::The report/state was persisted, but the post-persist Telegram delivery was not accepted."
          exit 1

      - name: Enforce scheduled delivery receipt
        if: ${{ always() && github.event_name == 'schedule' && steps.live_output.outputs.safe_operating_output == 'true' && steps.persist.outcome == 'success' && steps.telegram_delivery.outcome == 'success' && steps.scheduled_delivery_receipt.outcome != 'success' }}
        run: |
          echo "::error::Telegram accepted the report, but its durable scheduled-delivery receipt was not persisted; automatic retry is blocked to prevent duplicates."
          exit 1

      - name: Enforce analysis outcome
        if: ${{ always() && steps.analyze.outcome == 'failure' }}
        env:
          SAFE_OPERATING_OUTPUT: ${{ steps.live_output.outputs.safe_operating_output }}
        run: |
          if [ "$SAFE_OPERATING_OUTPUT" = "true" ]; then
            echo "::error::A safe deferred-delivery receipt was written, but the analysis step failed."
          else
            echo "::error::The analysis step failed before a validated live report/state receipt was available."
          fi
          exit 1

      - name: Write run summary
        if: ${{ always() }}
        env:
          EFFECTIVE_RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || github.event.inputs.run_mode || 'verify' }}
          JOB_STATUS: ${{ job.status }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          SAFE_OPERATING_OUTPUT: ${{ steps.live_output.outputs.safe_operating_output }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
          TELEGRAM_DELIVERY_OUTCOME: ${{ steps.telegram_delivery.outcome }}
          SCHEDULE_GUARD_DECISION: ${{ steps.schedule_guard.outputs.decision }}
          SCHEDULE_GUARD_REASON: ${{ steps.schedule_guard.outputs.reason }}
          SCHEDULED_DELIVERY_RECEIPT_OUTCOME: ${{ steps.scheduled_delivery_receipt.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## MerAI run summary"
            echo
            echo "- Mode: \`$EFFECTIVE_RUN_MODE\`"
            echo "- Status: \`$JOB_STATUS\`"
            echo "- Analysis step: \`$ANALYZE_OUTCOME\`"
            if [ -n "$SCHEDULE_GUARD_DECISION" ]; then
              echo "- Scheduled delivery guard: \`$SCHEDULE_GUARD_DECISION\` ($SCHEDULE_GUARD_REASON)"
            fi
            if [ -n "$SAFE_OPERATING_OUTPUT" ]; then
              echo "- Safe live output receipt: \`$SAFE_OPERATING_OUTPUT\`"
            fi
            if [ -n "$PERSIST_OUTCOME" ]; then
              echo "- Report/state persistence: \`$PERSIST_OUTCOME\`"
            fi
            if [ -n "$TELEGRAM_DELIVERY_OUTCOME" ]; then
              echo "- Post-persist Telegram delivery: \`$TELEGRAM_DELIVERY_OUTCOME\`"
            fi
            if [ -n "$SCHEDULED_DELIVERY_RECEIPT_OUTCOME" ]; then
              echo "- Scheduled delivery receipt persistence: \`$SCHEDULED_DELIVERY_RECEIPT_OUTCOME\`"
            fi
            echo "- Run: $RUN_URL"
            if [ -f output/portfolio_state.json ]; then
              echo "- Portfolio state: generated"
            fi
            if [ -f output/decision_latest.json ]; then
              echo "- Structured decision: generated"
            fi
            if [ -f output/chart_latest.png ]; then
              echo "- Telegram chart attachment: generated"
            fi
            echo "- For live runs, inspect the post-persist delivery step for chart and structured-summary receipts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify workflow failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are missing; failure notification skipped."
            exit 0
          fi
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          if curl --fail --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            --silent --output "$response_file" \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"MerAI GitHub Actions failed.\\n${RUN_URL}\",\"disable_web_page_preview\":true}"; then
            if RESPONSE_FILE="$response_file" python - <<'PY'
          import json
          import os
          import sys

          try:
              with open(os.environ["RESPONSE_FILE"], encoding="utf-8") as handle:
                  payload = json.load(handle)
          except (OSError, ValueError, TypeError):
              sys.exit(1)

          result = payload.get("result")
          message_id = result.get("message_id") if isinstance(result, dict) else None
          if payload.get("ok") is not True or isinstance(message_id, bool) or not isinstance(message_id, int):
              sys.exit(1)
          print(f"Telegram failure notification accepted: message_id={message_id}")
          PY
            then
              :
            else
              echo "::warning::Telegram failure notification was not accepted by Telegram."
            fi
          else
            echo "::warning::Telegram failure notification HTTP request failed."
          fi
