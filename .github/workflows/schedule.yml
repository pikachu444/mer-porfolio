name: 메르AI 포트폴리오 분석

on:
  # ── 자동 스케줄 (매일 자정 KST = UTC 15:00) ───────────────────────────────
  schedule:
    - cron: "0 15 * * *"

  # ── 수동 실행 (GitHub Actions 탭에서 직접 버튼 클릭 가능) ───────────────────
  workflow_dispatch:
    inputs:
      run_mode:
        description: "실행 모드 (adhoc=강제분석+리밸런싱, test=테스트전송없음)"
        required: true
        default: "adhoc"
        type: choice
        options:
          - adhoc
          - test
      fetch_days:
        description: "수집 기간 (일) — 비워두면 모드 기본값 사용"
        required: false
        default: ""
        type: string
      gemini_model:
        description: "Gemini 모델명 (비워두면 기본값 gemini-2.5-pro)"
        required: false
        default: ""
        type: string

# Node.js 24 강제 사용 (Node.js 20 deprecation 경고 해결)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 리포트 파일 커밋을 위해 필요

    steps:
      # ── 코드 체크아웃 ──────────────────────────────────────────────────────
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # ── Python 설치 ────────────────────────────────────────────────────────
      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 한글 폰트 설치 (matplotlib 차트 한글 깨짐 방지) ────────────────────
      - name: 한글 폰트 설치
        run: sudo apt-get install -y -q fonts-nanum && fc-cache -fv

      # ── 패키지 설치 ────────────────────────────────────────────────────────
      - name: 패키지 설치
        run: pip install -r requirements.txt

      # ── 분석 실행 ──────────────────────────────────────────────────────────
      - name: 메르AI 포트폴리오 분석 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://pikachu444.github.io/mer-porfolio/output/dashboard.html
          OUTPUT_DIR: output
          RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || github.event.inputs.run_mode || 'adhoc' }}
          FETCH_DAYS: ${{ github.event.inputs.fetch_days || '' }}
          GEMINI_MODEL: ${{ github.event.inputs.gemini_model || '' }}
        run: python main.py

      # ── 리포트 커밋 및 푸시 (test 모드 제외) ────────────────────────────────
      - name: 리포트 커밋 및 푸시
        if: ${{ github.event_name == 'schedule' || github.event.inputs.run_mode != 'test' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update MerAI report"
            git push
          fi

      - name: Notify workflow failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are missing; failure notification skipped."
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"MerAI GitHub Actions failed.\\n${RUN_URL}\",\"disable_web_page_preview\":true}"
