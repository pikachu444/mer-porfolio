name: Temporary historical market data collector

on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp-naver-probe-trigger.txt'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas
      - name: Collect adjusted OHLC and FX
        run: |
          python - <<'PY'
          import json, pathlib, pandas as pd, yfinance as yf
          symbols=[
            '8058.T','8031.T','8001.T','8002.T','8053.T',
            '042660.KS','010140.KS','329180.KS','009540.KS','010620.KS',
            '144600.KS','103140.KS','005930.KS','000660.KS','005380.KS',
            '138910.KS','URA','079550.KS','011070.KS','RXRX','454910.KS',
            '035420.KS','LLY','MRVL','^KS200','^GSPC','KRW=X','JPYKRW=X'
          ]
          out=pathlib.Path('market_data'); out.mkdir()
          summary=[]
          for symbol in symbols:
            try:
              df=yf.download(symbol,start='2026-01-14',end='2026-07-16',auto_adjust=True,progress=False,threads=False)
              if isinstance(df.columns,pd.MultiIndex):
                df.columns=df.columns.get_level_values(0)
              df=df.reset_index()
              df.to_csv(out/f"{symbol.replace('^','IDX_').replace('=','_').replace('/','_')}.csv",index=False)
              name=''
              try:
                name=(yf.Ticker(symbol).fast_info or {}).get('currency','')
              except Exception: pass
              summary.append({'symbol':symbol,'rows':len(df),'first':str(df['Date'].min()) if len(df) else None,'last':str(df['Date'].max()) if len(df) else None,'currency':name,'columns':list(df.columns)})
            except Exception as e:
              summary.append({'symbol':symbol,'rows':0,'error':f'{type(e).__name__}: {e}'})
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mer-backtest-market-data
          path: market_data
          retention-days: 7
