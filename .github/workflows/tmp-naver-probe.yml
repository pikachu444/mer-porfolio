name: Temporary Naver blog endpoint probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp-naver-probe-trigger.txt'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Probe compact API item
        run: |
          python - <<'PY'
          import json, pathlib, requests
          headers={'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1','Referer':'https://m.blog.naver.com/','Accept-Language':'ko-KR,ko;q=0.9'}
          u='https://m.blog.naver.com/api/blogs/ranto28/post-list?categoryNo=0&itemCount=1&page=1'
          r=requests.get(u,headers=headers,timeout=20); r.raise_for_status()
          p=pathlib.Path('probe'); p.mkdir()
          obj=r.json()
          (p/'compact.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(obj,ensure_ascii=False,indent=2)[:20000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: naver-probe-compact
          path: probe
