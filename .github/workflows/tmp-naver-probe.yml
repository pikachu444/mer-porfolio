name: Temporary Naver blog history collector

on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp-naver-probe-trigger.txt'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Collect dated post list
        run: |
          python - <<'PY'
          import json, pathlib, requests, time
          from datetime import datetime, timezone, timedelta
          headers={'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1','Referer':'https://m.blog.naver.com/','Accept-Language':'ko-KR,ko;q=0.9'}
          start=datetime(2026,1,15,tzinfo=timezone(timedelta(hours=9)))
          end=datetime(2026,7,16,tzinfo=timezone(timedelta(hours=9)))
          rows=[]; seen=set(); page=1
          while page <= 50:
            u=f'https://m.blog.naver.com/api/blogs/ranto28/post-list?categoryNo=0&itemCount=30&page={page}'
            r=requests.get(u,headers=headers,timeout=30); r.raise_for_status()
            items=(r.json().get('result') or {}).get('items') or []
            if not items: break
            oldest=None
            for item in items:
              log=str(item.get('logNo') or item.get('logNoObject') or '')
              if not log or log in seen: continue
              seen.add(log)
              ms=item.get('addDate')
              dt=datetime.fromtimestamp(ms/1000,tz=timezone(timedelta(hours=9))) if isinstance(ms,(int,float)) else None
              if dt and (oldest is None or dt < oldest): oldest=dt
              if dt and start <= dt < end:
                rows.append({
                  'logNo':log,
                  'published_at':dt.isoformat(),
                  'date':dt.date().isoformat(),
                  'title':item.get('titleWithInspectMessage') or '',
                  'brief':item.get('briefContents') or '',
                  'category':item.get('categoryName') or '',
                  'url':f'https://blog.naver.com/ranto28/{log}',
                })
            print('page',page,'items',len(items),'oldest',oldest.isoformat() if oldest else None,'kept',len(rows))
            if oldest and oldest < start: break
            page += 1
            time.sleep(.25)
          rows.sort(key=lambda x:x['published_at'])
          p=pathlib.Path('history'); p.mkdir()
          (p/'post_list.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          monthly={}
          for row in rows: monthly[row['date'][:7]]=monthly.get(row['date'][:7],0)+1
          summary={'count':len(rows),'first':rows[0]['published_at'] if rows else None,'last':rows[-1]['published_at'] if rows else None,'monthly':monthly,'pages_scanned':page}
          (p/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mer-blog-history-list
          path: history
